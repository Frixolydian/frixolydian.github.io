<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amaru</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
            background: #111;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<script>
    // --- Game Data ---
    // Updated to use texture keys instead of primitive shapes
    const LEVELS = [
        {
            bgKey: 'bg_lvl1',
            objects: [
                { texture: 'img_mariposa', x: 225, y: 170, name: '' },
                { texture: 'img_mariposa', x: 920, y: 530, name: '' },
                { texture: 'img_mariposa', x: 410, y: 505, name: '' },
                { texture: 'img_mariposa', x: 935, y: 50, name: '' },
                { texture: 'img_mariposa', x: 605, y: 270, name: '' }
            ],
            trivia: {
                q: "¿Cómo se llama el río más famoso y largo que cruza esta selva?",
                options: ["El río Amazonas", "El río Misisipi", "El río Nilo", "El río Danubio"],
                correct: 0
            }
        },
        {
            bgKey: 'bg_lvl1',
            objects: [
                { texture: 'img_pajaro', x: 112, y: 87, name: '' },
                { texture: 'img_pajaro', x: 570, y: 515, name: '' },
                { texture: 'img_pajaro', x: 890, y: 370, name: '' },
                { texture: 'img_pajaro', x: 623, y: 350, name: '' },
                { texture: 'img_pajaro', x: 320, y: 395, name: '' },
                { texture: 'img_pajaro', x: 730, y: 150, name: '' }
            ],
            trivia: {
                q: "¿Por qué se dice que la Amazonía es el 'pulmón del planeta'?",
                options: ["Tiene mucha agua", "Hace mucho calor", "Hace mucho viento", "Produce oxígeno"],
                correct: 3
            }
        },
        {
            bgKey: 'bg_lvl1',
            objects: [
                { texture: 'img_mariposa', x: 225, y: 170, name: '' },
                { texture: 'img_mariposa', x: 920, y: 530, name: '' },
                { texture: 'img_mariposa', x: 410, y: 505, name: '' },
                { texture: 'img_mariposa', x: 935, y: 50, name: '' },
                { texture: 'img_mariposa', x: 605, y: 270, name: '' }
            ],
            trivia: {
                q: "¿Qué animal se mueve muy, pero muy lento entre las ramas de los árboles?",
                options: ["El colibrí", "El oso perezoso", "La ardilla", "El mono araña"],
                correct: 1
            }
        }
    ];

    // --- Phaser Scene ---
    class HiddenObjectScene extends Phaser.Scene {
        constructor() {
            super({ key: 'HiddenObjectScene' });
        }

        preload() {
            // --- Loading Bar ---
            let progressBox = this.add.graphics();
            let progressBar = this.add.graphics();
            progressBox.fillStyle(0x222222, 0.8);
            progressBox.fillRect(240, 270, 320, 50);
            
            let loadingText = this.add.text(400, 260, 'Loading Dummy Images...', { fontSize: '20px', fill: '#ffffff' }).setOrigin(0.5);

            this.load.on('progress', function (value) {
                progressBar.clear();
                progressBar.fillStyle(0xffffff, 1);
                progressBar.fillRect(250, 280, 300 * value, 30);
            });

            this.load.on('complete', function () {
                progressBox.destroy();
                progressBar.destroy();
                loadingText.destroy();
            });

            // --- Loading Dummy Backgrounds ---
            // Generates a dummy 800x600 image with a solid color and text
            this.load.image('bg_lvl1', './fondo_1_1.png');
            this.load.image('bg_lvl2', 'https://dummyimage.com/800x600/4a235a/ffffff.png&text=Level+2+Background');
            this.load.image('bg_lvl3', 'https://dummyimage.com/800x600/0e6251/ffffff.png&text=Level+3+Background');

            // --- Loading Dummy Objects ---
            // Generates small dummy images to act as hidden objects
            this.load.image('img_pajaro', 'pajaro_1.png');
            this.load.image('img_mariposa', 'mariposa_1.png');
            this.load.image('img_key', 'https://dummyimage.com/40x20/f1c40f/000000.png&text=KEY');
            this.load.image('img_gem', 'https://dummyimage.com/25x25/e74c3c/ffffff.png&text=GEM');
            this.load.image('img_star', 'https://dummyimage.com/35x35/2ecc71/000000.png&text=STAR');
            this.load.image('img_moon', 'https://dummyimage.com/30x30/ecf0f1/000000.png&text=MOON');
            this.load.image('img_jade', 'https://dummyimage.com/30x40/16a085/ffffff.png&text=JADE');
            this.load.image('img_amber', 'https://dummyimage.com/30x30/e67e22/000000.png&text=AMBER');
            this.load.image('img_iron', 'https://dummyimage.com/25x25/7f8c8d/ffffff.png&text=IRON');
        }

        create() {
            this.currentLevelIndex = 0;
            this.maxTime = 60; // 30 seconds per level
            this.timeLeft = this.maxTime;
            this.gamePhase = 'searching';

            // UI Elements (Set depth to 100 so they render ABOVE backgrounds)
            this.levelText = this.add.text(16, 16, 'Nivel: 1', { fontSize: '20px', fill: '#fff' }).setDepth(100);
            this.statusText = this.add.text(16, 40, 'Encontrar: 0 / 3', { fontSize: '20px', fill: '#fff' }).setDepth(100);
            this.timeText = this.add.text(16, 64, 'Tiempo: 30s', { fontSize: '20px', fill: '#fff' }).setDepth(100);
            this.triviaText = this.add.text(500, 100, '', { fontSize: '28px', fill: '#fff', align: 'center', wordWrap: { width: 600 } }).setOrigin(0.5).setVisible(false).setDepth(100);
            
            // Time Bar UI
            this.timeBarBg = this.add.rectangle(400, 590, 800, 20, 0x000000).setDepth(100).setAlpha(0.7);
            this.timeBar = this.add.rectangle(0, 590, 800, 20, 0x00ff00).setOrigin(0, 0.5).setDepth(101);
            
            // Groups
            this.bgGroup = this.add.group();
            this.objectsGroup = this.add.group();
            this.triviaButtonsGroup = this.add.group();

            // Global click listener for penalties
            this.clickedObject = false; // Flag to track if a valid object was clicked
            this.input.on('pointerdown', (pointer) => {
                if (this.gamePhase === 'searching') {
                    if (!this.clickedObject) {
                        // Wrong click penalty
                        this.timeLeft -= 3; 
                        if (this.timeLeft < 0) this.timeLeft = 0;
                        
                        // Visual feedback for penalty
                        this.cameras.main.shake(200, 0.005);
                        this.updateTimeUI();
                    }
                    // Reset flag for next click
                    this.clickedObject = false; 
                }
            });

            this.startLevel(0);
        }

        update(time, delta) {
            // Only countdown if in the searching phase
            if (this.gamePhase === 'searching') {
                this.timeLeft -= delta / 1000; // delta is in milliseconds
                
                if (this.timeLeft <= 0) {
                    this.timeLeft = 0;
                    this.timeUp();
                }
                
                this.updateTimeUI();
            }
        }

        updateTimeUI() {
            let seconds = Math.ceil(this.timeLeft);
            this.timeText.setText('Tiempo: ' + seconds + 's');
            
            // Scale bar
            this.timeBar.width = 1000 * (this.timeLeft / this.maxTime);
            
            // Change color based on time left
            if (this.timeLeft > this.maxTime / 2) {
                this.timeBar.setFillStyle(0x00ff00); // Green
            } else if (this.timeLeft > this.maxTime / 4) {
                this.timeBar.setFillStyle(0xffff00); // Yellow
            } else {
                this.timeBar.setFillStyle(0xff0000); // Red
            }
        }

        startLevel(index) {
            // Reset level state
            this.foundCount = 0;
            this.gamePhase = 'searching';
            this.timeLeft = this.maxTime; // Reset timer for new level
            
            // Clear previous level assets
            this.bgGroup.clear(true, true);
            this.objectsGroup.clear(true, true);
            this.triviaButtonsGroup.clear(true, true);
            this.triviaText.setVisible(false);

            const levelData = LEVELS[index];
            
            // Draw Background Image
            let bg = this.add.image(500, 300, levelData.bgKey);
            this.bgGroup.add(bg);

            // Update UI
            this.levelText.setText('Nivel: ' + (index + 1));
            this.statusText.setText('Encontrar: 0 / ' + levelData.objects.length);

            // Spawn Hidden Objects
            levelData.objects.forEach((objData) => {
                let obj = this.add.image(objData.x, objData.y, objData.texture);
                obj.setAlpha(0.85);
                obj.setInteractive({ useHandCursor: true });
                
                obj.on('pointerdown', () => {
                    // Set flag so global listener doesn't apply penalty
                    this.clickedObject = true; 
                    
                    this.tweens.add({
                        targets: obj,
                        alpha: 0,
                        scale: 2,
                        duration: 300,
                        onComplete: () => obj.destroy()
                    });
                    this.foundCount++;
                    this.statusText.setText('Encontrar: ' + this.foundCount + ' / ' + levelData.objects.length);
                    
                    if (this.foundCount === levelData.objects.length) {
                        this.gamePhase = 'transition'; // Pause timer
                        this.time.delayedCall(500, this.startTrivia, [], this);
                    }
                });

                this.objectsGroup.add(obj);
            });
        }

        startTrivia() {
            this.gamePhase = 'trivia';
            this.statusText.setText('Answer the Trivia!');
            
            const levelData = LEVELS[this.currentLevelIndex];
            this.triviaText.setText(levelData.trivia.q);
            this.triviaText.setVisible(true);

            let yPos = 200;
            levelData.trivia.options.forEach((option, index) => {
                let btn = this.add.container(500, yPos);
                
                let bg = this.add.rectangle(0, 0, 300, 50, 0x34495e).setStrokeStyle(2, 0xffffff);
                let text = this.add.text(0, 0, option, { fontSize: '20px', fill: '#fff' }).setOrigin(0.5);
                
                btn.add([bg, text]);
                btn.setSize(300, 50);
                btn.setInteractive({ useHandCursor: true });
                btn.setDepth(100); // Ensure trivia is above background

                btn.on('pointerover', () => bg.setFillStyle(0x465a7a));
                btn.on('pointerout', () => bg.setFillStyle(0x34495e));
                
                btn.on('pointerdown', () => this.answerTrivia(index));

                this.triviaButtonsGroup.add(btn);
                yPos += 70;
            });
        }

        answerTrivia(selectedIndex) {
            const levelData = LEVELS[this.currentLevelIndex];
            let isCorrect = (selectedIndex === levelData.trivia.correct);

            // Disable buttons so user can't click multiple
            this.triviaButtonsGroup.getChildren().forEach(btn => {
                btn.disableInteractive();
            });

            if (isCorrect) {
                this.statusText.setText('Correct! Advancing...');
                this.cameras.main.flash(500, 0, 255, 0);
            } else {
                this.statusText.setText('Wrong! Advancing anyway...');
                this.cameras.main.flash(500, 255, 0, 0);
            }

            // Advance to next level after a delay
            this.time.delayedCall(2000, () => {
                this.currentLevelIndex++;
                if (this.currentLevelIndex < LEVELS.length) {
                    this.startLevel(this.currentLevelIndex);
                } else {
                    this.gameOver();
                }
            });
        }

        timeUp() {
            this.gamePhase = 'gameover';
            this.gameOver(true);
        }

        gameOver(isTimeUp = false) {
            // Clear everything
            this.triviaButtonsGroup.clear(true, true);
            this.objectsGroup.clear(true, true);
            this.bgGroup.clear(true, true);
            this.triviaText.setVisible(false);
            this.statusText.setVisible(false);
            
            // Hide time bar
            this.timeBar.setVisible(false);
            this.timeBarBg.setVisible(false);
            this.timeText.setVisible(false);

            let title = isTimeUp ? "Time's Up!" : "Game Complete!";
            let color = isTimeUp ? '#ff0000' : '#fff';
            
            this.add.text(400, 300, title, { fontSize: '48px', fill: color }).setOrigin(0.5).setDepth(100);
            
            let restartBtn = this.add.text(400, 400, 'Click to Play Again', { fontSize: '24px', fill: '#0f0' })
                .setOrigin(0.5)
                .setInteractive({ useHandCursor: true })
                .setDepth(100);
                
            restartBtn.on('pointerdown', () => {
                this.scene.restart();
            });
        }
    }

    // --- Game Configuration ---
    const config = {
        type: Phaser.AUTO,
        parent: 'body', // Tells Phaser to attach the canvas directly to the body
        width: 1000,     // Your base game width
        height: 600,    // Your base game height
        scale: {
            mode: Phaser.Scale.FIT,        // Scales the canvas to fit the screen
            autoCenter: Phaser.Scale.CENTER_BOTH // Centers it vertically and horizontally
        },
        backgroundColor: '#000',
        scene: HiddenObjectScene
    };

    // Create the game instance
    const game = new Phaser.Game(config);
</script>

</body>
</html>
